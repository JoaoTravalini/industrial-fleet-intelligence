[project]
name = "industrial-fleet-intelligence"
version = "0.1.0"
description = "Local-first industrial Data and AI platform portfolio project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
data = [
    "pandas",
    "numpy",
    "matplotlib",
]
ml = [
    "scikit-learn",
    "xgboost",
    "joblib",
]
mlops = [
    "mlflow==3.14.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"